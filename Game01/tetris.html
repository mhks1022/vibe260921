<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테트리스</title>
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --border: #0f3460;
    --accent: #e94560;
    --text: #f1f1f1;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg), #0f0f1e);
    font-family: "Malgun Gothic", "Segoe UI", sans-serif;
    color: var(--text);
  }

  .game-wrap {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    padding: 20px;
  }

  .board-panel {
    position: relative;
    background: var(--panel);
    padding: 10px;
    border-radius: 10px;
    border: 2px solid var(--border);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  canvas {
    display: block;
    background: #0d0d1a;
    border-radius: 4px;
  }

  #board {
    width: 300px;
    height: 600px;
  }

  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 180px;
  }

  .box {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }

  .box h3 {
    margin: 0 0 8px;
    font-size: 13px;
    letter-spacing: 1px;
    color: #9aa5ce;
    text-transform: uppercase;
  }

  .box .value {
    font-size: 26px;
    font-weight: bold;
    color: var(--accent);
  }

  #next {
    width: 120px;
    height: 120px;
    background: #0d0d1a;
    border-radius: 4px;
    display: block;
    margin: 0 auto;
  }

  .controls {
    font-size: 12px;
    line-height: 1.8;
    color: #9aa5ce;
  }

  .controls b {
    color: var(--text);
  }

  #overlay {
    position: absolute;
    inset: 10px;
    background: rgba(10, 10, 20, 0.88);
    border-radius: 6px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
  }

  #overlay.show {
    display: flex;
  }

  #overlay h2 {
    margin: 0;
    color: var(--accent);
    font-size: 24px;
  }

  #overlay p {
    margin: 0;
    color: var(--text);
    font-size: 14px;
  }

  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.1s ease;
  }

  button:hover {
    opacity: 0.9;
  }

  button:active {
    transform: scale(0.96);
  }

  @media (max-width: 560px) {
    .game-wrap {
      flex-direction: column;
      align-items: center;
    }
    .side-panel {
      flex-direction: row;
      flex-wrap: wrap;
      width: 300px;
    }
    .box {
      flex: 1 1 80px;
    }
  }
</style>
</head>
<body>

<div class="game-wrap">
  <div class="board-panel">
    <canvas id="board"></canvas>
    <div id="overlay">
      <h2 id="overlayTitle">테트리스</h2>
      <p id="overlayText">스페이스바 또는 시작 버튼을 눌러 시작하세요</p>
      <button id="startBtn">시작</button>
    </div>
  </div>

  <div class="side-panel">
    <div class="box">
      <h3>다음 블록</h3>
      <canvas id="next"></canvas>
    </div>
    <div class="box">
      <h3>점수</h3>
      <div class="value" id="score">0</div>
    </div>
    <div class="box">
      <h3>레벨</h3>
      <div class="value" id="level">1</div>
    </div>
    <div class="box">
      <h3>줄 수</h3>
      <div class="value" id="lines">0</div>
    </div>
    <div class="box controls">
      <h3>조작법</h3>
      <div><b>←/→</b> : 좌우 이동</div>
      <div><b>↓</b> : 소프트 드롭</div>
      <div><b>↑</b> : 회전</div>
      <div><b>Space</b> : 하드 드롭</div>
      <div><b>P</b> : 일시정지</div>
    </div>
  </div>
</div>

<script>
(() => {
  const COLS = 10;
  const ROWS = 20;
  const CELL = 30;

  const boardCanvas = document.getElementById('board');
  const boardCtx = boardCanvas.getContext('2d');
  boardCanvas.width = COLS * CELL;
  boardCanvas.height = ROWS * CELL;

  const nextCanvas = document.getElementById('next');
  const nextCtx = nextCanvas.getContext('2d');
  nextCanvas.width = 120;
  nextCanvas.height = 120;

  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const linesEl = document.getElementById('lines');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');

  const COLORS = {
    I: '#4dd0e1',
    O: '#ffd54f',
    T: '#ba68c8',
    S: '#81c784',
    Z: '#e57373',
    J: '#64b5f6',
    L: '#ffb74d',
  };

  const SHAPES = {
    I: [
      [[0,1],[1,1],[2,1],[3,1]],
      [[2,0],[2,1],[2,2],[2,3]],
      [[0,2],[1,2],[2,2],[3,2]],
      [[1,0],[1,1],[1,2],[1,3]],
    ],
    O: [
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
    ],
    T: [
      [[1,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[2,1],[1,2]],
      [[1,0],[0,1],[1,1],[1,2]],
    ],
    S: [
      [[1,0],[2,0],[0,1],[1,1]],
      [[1,0],[1,1],[2,1],[2,2]],
      [[1,1],[2,1],[0,2],[1,2]],
      [[0,0],[0,1],[1,1],[1,2]],
    ],
    Z: [
      [[0,0],[1,0],[1,1],[2,1]],
      [[2,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[1,2],[2,2]],
      [[1,0],[0,1],[1,1],[0,2]],
    ],
    J: [
      [[0,0],[0,1],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[1,2]],
      [[0,1],[1,1],[2,1],[2,2]],
      [[1,0],[1,1],[0,2],[1,2]],
    ],
    L: [
      [[2,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[1,2],[2,2]],
      [[0,1],[1,1],[2,1],[0,2]],
      [[0,0],[1,0],[1,1],[1,2]],
    ],
  };

  const PIECE_TYPES = Object.keys(SHAPES);

  function randomType() {
    return PIECE_TYPES[Math.floor(Math.random() * PIECE_TYPES.length)];
  }

  function createGrid() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }

  let grid = createGrid();
  let current = null;
  let next = null;
  let score = 0;
  let level = 1;
  let lines = 0;
  let dropInterval = 1000;
  let dropTimer = 0;
  let lastTime = 0;
  let running = false;
  let paused = false;
  let gameOver = false;
  let rafId = null;

  function newPiece(type) {
    return { type, rotation: 0, x: 3, y: -2 };
  }

  function getCells(piece) {
    return SHAPES[piece.type][piece.rotation].map(([cx, cy]) => [piece.x + cx, piece.y + cy]);
  }

  function collides(piece, offsetX = 0, offsetY = 0, rotation = null) {
    const testPiece = {
      ...piece,
      x: piece.x + offsetX,
      y: piece.y + offsetY,
      rotation: rotation === null ? piece.rotation : rotation,
    };
    const cells = getCells(testPiece);
    for (const [x, y] of cells) {
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function lockPiece() {
    const cells = getCells(current);
    for (const [x, y] of cells) {
      if (y < 0) {
        triggerGameOver();
        return;
      }
      grid[y][x] = COLORS[current.type];
    }
    clearLines();
    spawnPiece();
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(cell => cell)) {
        grid.splice(y, 1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800][cleared] * level;
      score += points;
      lines += cleared;
      level = Math.floor(lines / 10) + 1;
      dropInterval = Math.max(120, 1000 - (level - 1) * 80);
      updateStats();
    }
  }

  function spawnPiece() {
    current = next || newPiece(randomType());
    next = newPiece(randomType());
    current.x = 3;
    current.y = -2;
    drawNext();
    if (collides(current)) {
      triggerGameOver();
    }
  }

  function triggerGameOver() {
    gameOver = true;
    running = false;
    overlayTitle.textContent = '게임 오버';
    overlayText.textContent = `최종 점수: ${score}`;
    startBtn.textContent = '다시 시작';
    overlay.classList.add('show');
    cancelAnimationFrame(rafId);
  }

  function updateStats() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    linesEl.textContent = lines;
  }

  function move(dx) {
    if (!running || paused || gameOver) return;
    if (!collides(current, dx, 0)) {
      current.x += dx;
      draw();
    }
  }

  function softDrop() {
    if (!running || paused || gameOver) return;
    if (!collides(current, 0, 1)) {
      current.y += 1;
      score += 1;
      updateStats();
    } else {
      lockPiece();
    }
    draw();
    dropTimer = 0;
  }

  function hardDrop() {
    if (!running || paused || gameOver) return;
    let dist = 0;
    while (!collides(current, 0, dist + 1)) {
      dist++;
    }
    current.y += dist;
    score += dist * 2;
    updateStats();
    lockPiece();
    draw();
    dropTimer = 0;
  }

  function rotate() {
    if (!running || paused || gameOver) return;
    const newRotation = (current.rotation + 1) % 4;
    const kicks = [0, -1, 1, -2, 2];
    for (const kick of kicks) {
      if (!collides(current, kick, 0, newRotation)) {
        current.x += kick;
        current.rotation = newRotation;
        draw();
        return;
      }
    }
  }

  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    if (paused) {
      overlayTitle.textContent = '일시정지';
      overlayText.textContent = 'P 키 또는 버튼을 눌러 계속하기';
      startBtn.textContent = '계속하기';
      overlay.classList.add('show');
      cancelAnimationFrame(rafId);
    } else {
      overlay.classList.remove('show');
      lastTime = performance.now();
      rafId = requestAnimationFrame(loop);
    }
  }

  function drawCell(ctx, x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.strokeRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
  }

  function draw() {
    boardCtx.fillStyle = '#0d0d1a';
    boardCtx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (grid[y][x]) drawCell(boardCtx, x, y, grid[y][x]);
      }
    }

    if (current) {
      let ghostY = 0;
      while (!collides(current, 0, ghostY + 1)) ghostY++;
      boardCtx.globalAlpha = 0.25;
      for (const [x, y] of getCells(current)) {
        const gy = y + ghostY;
        if (gy >= 0) drawCell(boardCtx, x, gy, COLORS[current.type]);
      }
      boardCtx.globalAlpha = 1;

      for (const [x, y] of getCells(current)) {
        if (y >= 0) drawCell(boardCtx, x, y, COLORS[current.type]);
      }
    }

    for (let x = 0; x <= COLS; x++) {
      boardCtx.strokeStyle = 'rgba(255,255,255,0.03)';
      boardCtx.beginPath();
      boardCtx.moveTo(x * CELL, 0);
      boardCtx.lineTo(x * CELL, boardCanvas.height);
      boardCtx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      boardCtx.beginPath();
      boardCtx.moveTo(0, y * CELL);
      boardCtx.lineTo(boardCanvas.width, y * CELL);
      boardCtx.stroke();
    }
  }

  function drawNext() {
    nextCtx.fillStyle = '#0d0d1a';
    nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!next) return;

    const cells = SHAPES[next.type][0];
    const size = 24;
    const xs = cells.map(c => c[0]);
    const ys = cells.map(c => c[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const w = (maxX - minX + 1) * size;
    const h = (maxY - minY + 1) * size;
    const offsetX = (nextCanvas.width - w) / 2 - minX * size;
    const offsetY = (nextCanvas.height - h) / 2 - minY * size;

    nextCtx.fillStyle = COLORS[next.type];
    for (const [cx, cy] of cells) {
      nextCtx.fillRect(cx * size + offsetX + 1, cy * size + offsetY + 1, size - 2, size - 2);
      nextCtx.strokeStyle = 'rgba(255,255,255,0.15)';
      nextCtx.strokeRect(cx * size + offsetX + 1, cy * size + offsetY + 1, size - 2, size - 2);
    }
  }

  function loop(time) {
    if (!running || paused || gameOver) return;
    const delta = time - lastTime;
    lastTime = time;
    dropTimer += delta;

    if (dropTimer > dropInterval) {
      if (!collides(current, 0, 1)) {
        current.y += 1;
      } else {
        lockPiece();
      }
      dropTimer = 0;
      draw();
    }

    rafId = requestAnimationFrame(loop);
  }

  function startGame() {
    grid = createGrid();
    score = 0;
    level = 1;
    lines = 0;
    dropInterval = 1000;
    dropTimer = 0;
    gameOver = false;
    paused = false;
    running = true;
    next = newPiece(randomType());
    updateStats();
    spawnPiece();
    overlay.classList.remove('show');
    startBtn.textContent = '다시 시작';
    draw();
    lastTime = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', (e) => {
    switch (e.code) {
      case 'ArrowLeft':
        e.preventDefault();
        move(-1);
        break;
      case 'ArrowRight':
        e.preventDefault();
        move(1);
        break;
      case 'ArrowDown':
        e.preventDefault();
        softDrop();
        break;
      case 'ArrowUp':
        e.preventDefault();
        rotate();
        break;
      case 'Space':
        e.preventDefault();
        if (!running || gameOver) {
          startGame();
        } else {
          hardDrop();
        }
        break;
      case 'KeyP':
        e.preventDefault();
        togglePause();
        break;
    }
  });

  startBtn.addEventListener('click', () => {
    if (paused) {
      togglePause();
    } else {
      startGame();
    }
  });

  draw();
  drawNext();
})();
</script>

</body>
</html>
